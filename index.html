<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FF0000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="經典瑪莉歐風格平台跳躍遊戲 - PWA 離線可玩">
  <title>超級瑪莉歐冒險</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="shortcut icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css?v=2.19.0">
</head>

<body>
  <!-- Start Screen -->
  <div id="startScreen">
    <div id="gameTitle">🍄 超級冒險 🍄</div>
    <div id="gameSubtitle">Mario Style Platformer</div>
    <div id="startInstructions">
      <p>🎮 <strong>操作方式</strong></p>
      <p>⬅️ ➡️ 方向鍵移動 | 空白鍵跳躍</p>
      <p>📱 觸控螢幕：點擊移動 | 點擊跳躍</p>
    </div>
    <button id="startButton">開始遊戲</button>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameArea"></canvas>

  <!-- Game UI -->
  <div id="gameUI">
    <div id="score">⭐ 0</div>
    <div id="highScore">🏆 0</div>
    <button id="muteButton">🔊</button>
    <button id="settingsButton" title="音效設定">⚙️</button>
    <button id="fullscreenButton">⛶</button>
    <button id="pauseButton">⏸️</button>
  </div>

  <!-- Pause Overlay -->
  <div id="pauseOverlay">
    <div id="pauseText">⏸️ 暫停</div>
    <div id="pauseContent">
      <div id="pauseStats">
        <div class="stat-row"><span>💀 擊殺</span><span id="pauseKills">0</span></div>
        <div class="stat-row"><span>🪙 金幣</span><span id="pauseCoins">0</span></div>
        <div class="stat-row"><span>👑 分數</span><span id="pauseScore">0</span></div>
        <div class="stat-row"><span>🏅 成就</span><span id="pauseAchievements">0/0</span></div>
      </div>
      <div id="controlGuide">
        <div class="guide-title">🎮 操作說明</div>
        <div class="guide-row"><span>⬅️➡️</span><span>移動</span></div>
        <div class="guide-row"><span>空白鍵</span><span>跳躍</span></div>
        <div class="guide-row"><span>⬇️ / S</span><span>蹲下</span></div>
        <div class="guide-row"><span>Shift</span><span>衝刺</span></div>
        <div class="guide-row"><span>牆壁+跳</span><span>蹬牆跳</span></div>
      </div>
    </div>
    <button id="resumeButton">繼續遊戲</button>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay">
    <div id="gameOver">遊戲結束！</div>
    <div id="finalScore"></div>
    <div id="finalHighScore"></div>
    <button id="restartButton">重新開始</button>
  </div>

  <!-- Audio Settings Modal -->
  <div id="audioSettingsModal" class="modal-overlay">
    <div class="modal-content">
      <h3>🔊 音效設定</h3>
      <div class="volume-control">
        <label>🎵 音樂 (BGM)</label>
        <input type="range" id="musicVolumeSlider" min="0" max="100" value="40">
        <span id="musicVolumeValue">40%</span>
      </div>
      <div class="volume-control">
        <label>🔔 音效 (SFX)</label>
        <input type="range" id="sfxVolumeSlider" min="0" max="100" value="70">
        <span id="sfxVolumeValue">70%</span>
      </div>
      <button id="closeSettingsBtn">確定</button>
    </div>
  </div>

  <!-- Touch Controls -->
  <div id="controlButtons">
    <div id="leftButton" class="controlButton">◀</div>
    <div id="jumpButton" class="controlButton">↑</div>
    <div id="rightButton" class="controlButton">▶</div>
  </div>

  <script type="module" src="js/main.js?v=2.19.0"></script>
  <script>
    // Unregister Service Worker to prevent caching issues during development/debugging
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
          console.log('Service Worker unregistered');
        }
      });
    }

    window.onerror = function (message, source, lineno, colno, error) {
      const errorDiv = document.createElement('div');
      errorDiv.style.position = 'fixed';
      errorDiv.style.top = '0';
      errorDiv.style.left = '0';
      errorDiv.style.width = '100%';
      errorDiv.style.backgroundColor = 'red';
      errorDiv.style.color = 'white';
      errorDiv.style.padding = '10px';
      errorDiv.style.zIndex = '9999';
      errorDiv.textContent = `Error: ${message} at ${source}:${lineno}:${colno}`;
      document.body.appendChild(errorDiv);
      console.error(error);
    };
  </script>
</body>

</html>
