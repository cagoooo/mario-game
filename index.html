<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FF0000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="經典瑪莉歐風格平台跳躍遊戲 - PWA 離線可玩">
  <title>超級瑪莉歐冒險</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Start Screen -->
  <div id="startScreen">
    <div id="gameTitle">🍄 超級冒險 🍄</div>
    <div id="gameSubtitle">Mario Style Platformer</div>
    <div id="startInstructions">
      <p>🎮 <strong>操作方式</strong></p>
      <p>⬅️ ➡️ 方向鍵移動 | 空白鍵跳躍</p>
      <p>📱 觸控螢幕：點擊移動 | 點擊跳躍</p>
    </div>
    <button id="startButton">開始遊戲</button>
  </div>

  <!-- Game UI -->
  <div id="gameUI">
    <div id="topBar">
      <div id="score">⭐ 0</div>
      <div id="highScore">🏆 0</div>
      <div id="topButtons">
        <button id="pauseButton" class="iconButton">⏸️</button>
        <button id="muteButton" class="iconButton">🔊</button>
        <button id="fullscreenButton" class="iconButton">⛶</button>
      </div>
    </div>
  </div>

  <!-- Game Canvas -->
  <canvas id="gameArea" width="800" height="400"></canvas>

  <!-- Pause Overlay -->
  <div id="pauseOverlay">
    <div id="pauseText">⏸️ 暫停</div>
    <button id="resumeButton">繼續遊戲</button>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay">
    <div id="gameOver">遊戲結束！</div>
    <div id="finalScore"></div>
    <button id="restartButton">重新開始</button>
  </div>

  <!-- Touch Controls -->
  <div id="controlButtons">
    <div id="leftButton" class="controlButton">◀</div>
    <div id="jumpButton" class="controlButton">↑</div>
    <div id="rightButton" class="controlButton">▶</div>
  </div>

  <script type="module" src="js/main.js?v=1.1.3"></script>
  <script>
    // Unregister Service Worker to prevent caching issues during development/debugging
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
          console.log('Service Worker unregistered');
        }
      });
    }
  </script>
</body>

</html>
