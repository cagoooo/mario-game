<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FF0000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="經典瑪莉歐風格平台跳躍遊戲 - PWA 離線可玩">
  <title>超級瑪莉歐冒險</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Start Screen -->
  <div id="startScreen">
    <div id="gameTitle">🍄 超級冒險 🍄</div>
    <div id="gameSubtitle">Mario Style Platformer</div>
    <div id="startInstructions">
      <p>🎮 <strong>操作方式</strong></p>
      <p>⬅️ ➡️ 方向鍵移動 | 空白鍵跳躍</p>
      <p>📱 觸控螢幕：點擊移動 | 點擊跳躍</p>
    </div>
    <button id="startButton">開始遊戲</button>
  </div>

  <div id="pauseOverlay">
    <div id="pauseText">⏸️ 暫停</div>
    <button id="resumeButton">繼續遊戲</button>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay">
    <div id="gameOver">遊戲結束！</div>
    <div id="finalScore"></div>
    <button id="restartButton">重新開始</button>
    navigator.serviceWorker.register('./sw.js')
    .then(reg => console.log('Service Worker registered'))
    .catch(err => console.log('Service Worker registration failed:', err));
    });
    }
    </script>
</body>

</html>
